name: ResumeDot CI

on:
  push:
    branches: [main, "ci/**", "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend-quality:
    name: Frontend lint and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Build frontend
        run: npm run build

  backend-syntax:
    name: Backend JavaScript syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -e
          while IFS= read -r file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -path ./node_modules -prune -o -name '*.js' -type f -print)
